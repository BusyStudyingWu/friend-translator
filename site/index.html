<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07594e"><title>朋友话翻译器</title>
<link rel="stylesheet" href="./style.css?v=teal-2"></head>
<body><main>
<section class="screen" aria-labelledby="title">
<header><small>星星酱的友情实验室</small><h1 id="title">朋友话翻译器</h1><p>有时不是不在乎，只是没听明白。</p></header>
<div class="body">
<details class="key-panel"><summary>连接你的 DeepSeek <span>仅本次使用 ›</span></summary>
<div class="keys"><label for="api-key">你的 DeepSeek API Key</label><div class="row"><input id="api-key" type="password" autocomplete="off" spellcheck="false"><button id="clear-key">清空</button></div><p>密钥仅在本页内存使用。翻译时，原话和背景直接发往 DeepSeek，使用你的账户额度。</p></div></details>
<label for="phrase">朋友说</label><div class="phrase-box"><textarea id="phrase" maxlength="240" placeholder="你现在朋友挺多的。"></textarea><small id="count">0 / 240</small></div>
<label for="context">当时发生了什么？ <small>选填</small></label><textarea id="context" maxlength="600" placeholder="比如，我刚发了一张聚餐照。我们最近确实很少见面。"></textarea>
<button id="translate" class="primary">一起听听 ↗</button><button id="demo" class="secondary">试试内置示例</button><p id="notice" role="status"></p>
<details class="extra"><summary>挑一句原话试试</summary><div class="samples"><button data-sample="0">随便你。</button><button data-sample="1">你朋友挺多的。</button><button data-sample="2">我画地为牢。</button><button data-sample="3">不用了，我自己来。</button></div></details>
</div></section>
<section class="screen" id="result" hidden aria-live="polite"><header><small>朋友话翻译器</small><h2 id="quote"></h2><p>也许，TA 想说…</p></header>
<div class="body"><div id="possibilities"></div>
<article class="reply"><small>可以这样回</small><p id="ask"></p></article><p class="foot">三种可能，不是定论。</p>
<details class="extra"><summary>看看解读依据</summary><small id="source"></small><div id="background-message" hidden><b>当时的背景</b><p id="background-text"></p></div><b>字面上的意思</b><p id="literal"></p><div><b>还需要问清的事</b><p id="missing"></p></div></details>
<div id="switcher" hidden><p>换个背景，再听一遍</p><div class="samples"><button data-scene="0">正在选餐厅</button><button data-scene="1">第三次改约</button></div><p id="scene-description"></p></div>
<button id="again" class="secondary">↑ 补充背景，重新翻译</button></div></section>
</main><script src="./app.js?v=teal-1"></script></body></html>
